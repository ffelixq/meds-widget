name: Fix widget codec Detekt

on:
  push:
    branches:
      - feature/v2-product-core

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v2-product-core
          fetch-depth: 0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply codec refactor
        run: python3 scripts/fix_widget_codec_detekt.py
      - name: Format Kotlin
        run: ./gradlew --no-daemon ktlintFormat
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/ffelixq/medswidget/widget/WidgetSnapshot.kt
          git commit -m "refactor: finish widget codec quality cleanup"
          git push origin HEAD:feature/v2-product-core
