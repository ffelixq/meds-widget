name: Apply V2 runtime integration

on:
  push:
    branches:
      - feature/v2-product-core

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v2-product-core
          fetch-depth: 0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply integration patches
        run: python3 scripts/complete_v2_runtime.py
      - name: Format Kotlin sources
        run: ./gradlew --no-daemon ktlintFormat
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app firestore.rules
          git commit -m "feat: complete V2 reminder supply widget and export runtime"
          git push origin HEAD:feature/v2-product-core
