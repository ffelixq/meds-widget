name: Fix V2 style conflicts

on:
  push:
    branches:
      - feature/v2-product-core

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/v2-product-core
          fetch-depth: 0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve formatter and line-length conflicts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          validation = Path('app/src/main/java/io/github/ffelixq/medswidget/domain/MedicineValidation.kt')
          text = validation.read_text()
          text = text.replace(
              'private fun invalidPositiveNumber(value: Double?): Boolean = value == null || !value.isFinite() || value <= 0.0 || value > SUPPLY_MAX_UNITS',
              '''private fun invalidPositiveNumber(value: Double?): Boolean {\n    if (value == null) return true\n    return !value.isFinite() || value <= 0.0 || value > SUPPLY_MAX_UNITS\n}''',
          )
          validation.write_text(text)

          screen = Path('app/src/main/java/io/github/ffelixq/medswidget/ui/MedicineScreen.kt')
          text = screen.read_text()
          text = text.replace(
              'private fun Double.toDisplayNumber(): String = if (this % 1.0 == 0.0) toLong().toString() else toString()',
              '''private fun Double.toDisplayNumber(): String {\n    return if (this % 1.0 == 0.0) toLong().toString() else toString()\n}''',
          )
          text = text.replace(
              'private fun formatClockMinutes(minutesAfterMidnight: Int): String = "%02d:%02d".format(minutesAfterMidnight / 60, minutesAfterMidnight % 60)',
              '''private fun formatClockMinutes(minutesAfterMidnight: Int): String {\n    return "%02d:%02d".format(\n        minutesAfterMidnight / 60,\n        minutesAfterMidnight % 60,\n    )\n}''',
          )
          screen.write_text(text)
          PY
          ./gradlew --no-daemon ktlintFormat
      - name: Commit normalized sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src
          git commit -m "style: resolve final V2 static-analysis conflicts"
          git push origin HEAD:feature/v2-product-core
