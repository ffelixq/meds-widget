version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /firebase-tests
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      rules-tests-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
